services:
  - type: web
    name: pan-brain-gcs
    runtime: node
    plan: free
    rootDir: cloud
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MQTT_URL
        value: mqtt://broker.hivemq.com:1883
      - key: DEVICE_ID
        value: drone_brain_01
      - key: ENABLE_SITL_SIM
        value: "true"
